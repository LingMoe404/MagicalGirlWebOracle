[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magicalgirl-web-oracle"
version = "0.1.0"
description = "Zero-cost web search, deep research and page fetching for AI agents, routed across free-tier providers and self-hosted fallbacks over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "LingMoe404" }]
keywords = ["search", "mcp", "agent", "searxng", "exa", "tavily", "crawl4ai", "deep-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "mcp>=1.2,<2",
    "click>=8.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "cryptography>=43",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/LingMoe404/MagicalGirlWebOracle"
Repository = "https://github.com/LingMoe404/MagicalGirlWebOracle"
Issues = "https://github.com/LingMoe404/MagicalGirlWebOracle/issues"
Changelog = "https://github.com/LingMoe404/MagicalGirlWebOracle/blob/main/CHANGELOG.md"

[project.scripts]
magicalgirl-web = "magicalgirl_web_oracle.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magicalgirl_web_oracle = ["config/defaults/*.yaml", "admin/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

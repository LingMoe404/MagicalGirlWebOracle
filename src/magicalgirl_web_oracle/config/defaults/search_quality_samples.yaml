# Fixed, public sample set for reproducible retrieval-quality checks.
# These are not user queries. Real runs consume provider free quota; use
# `magicalgirl-web quality-eval --live --max-samples 6`.
samples:
  - id: python-asyncio-timeout
    query: "Python asyncio wait_for timeout documentation"
    language: en
    expected_domains: ["docs.python.org"]
    expected_keywords: ["asyncio", "timeout"]
  - id: sqlite-wal-backup
    query: "SQLite WAL mode backup API documentation"
    language: en
    expected_domains: ["sqlite.org"]
    expected_keywords: ["backup", "WAL"]
  - id: fastapi-websocket-auth
    query: "FastAPI WebSocket authentication dependencies documentation"
    language: en
    expected_domains: ["fastapi.tiangolo.com"]
    expected_keywords: ["WebSocket", "dependencies"]
  - id: fluent-ui-button
    query: "Fluent UI React v9 Button component documentation"

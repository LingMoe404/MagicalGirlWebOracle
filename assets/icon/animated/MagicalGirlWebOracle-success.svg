<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    
    
    <style>
      @keyframes mg-spin-weboracle { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes mg-spin-rev-weboracle { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
      @keyframes mg-pulse-weboracle { 0%, 100% { opacity: 0.45; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes mg-core-flash-weboracle { 0%, 100% { filter: brightness(1); opacity: 0.82; } 50% { filter: brightness(1.45) drop-shadow(0 0 8px #FFD54F); opacity: 1; } }
      @keyframes mg-dash-flow-weboracle { to { stroke-dashoffset: -48; } }
      @keyframes mg-eye-scan-weboracle { 0%, 100% { transform: translate(0px, 0px) scale(1); } 25% { transform: translate(-8px, -3px) scale(1.08); } 75% { transform: translate(8px, 3px) scale(1.08); } }
      @keyframes mg-blink-weboracle { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
      @keyframes mg-float-up-weboracle { 0%, 100% { transform: translateY(0px); opacity: 0.9; } 50% { transform: translateY(-10px); opacity: 1; } }
      @keyframes mg-alert-shake-weboracle { 0%, 100% { transform: rotate(0deg); } 20% { transform: rotate(-4deg); } 40% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(3deg); } }
      .mg-rot-cw { transform-origin: 256px 256px; animation: mg-spin-weboracle 10s linear infinite; }
      .mg-rot-ccw { transform-origin: 256px 256px; animation: mg-spin-rev-weboracle 14s linear infinite; }
      .mg-rot-local { transform-box: fill-box; transform-origin: center; animation: mg-spin-weboracle 8s linear infinite; }
      .mg-pulse-glow { transform-box: fill-box; transform-origin: center; animation: mg-pulse-weboracle 2.2s ease-in-out infinite; }
      .mg-pcore-active { animation: mg-core-flash-weboracle 1.4s ease-in-out infinite; }
      .mg-stream-dash { animation: mg-dash-flow-weboracle 1.2s linear infinite; }
      .mg-pupil-scan { transform-box: fill-box; transform-origin: center; animation: mg-eye-scan-weboracle 3.2s ease-in-out infinite; }
      .mg-cursor-blink { animation: mg-blink-weboracle 0.9s infinite; }
      .mg-float { animation: mg-float-up-weboracle 2.4s ease-in-out infinite; }
      .mg-alert-wobble { transform-origin: 256px 256px; animation: mg-alert-shake-weboracle 0.7s ease-in-out infinite; }
    </style>
  
    <linearGradient id="ap-gold-weboracle-512" x1="0.06" y1="0.04" x2="0.94" y2="0.96">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#FFF4C8"/>
      <stop offset="42%" stop-color="#F7C957"/>
      <stop offset="68%" stop-color="#DC9318"/>
      <stop offset="88%" stop-color="#9A5B00"/>
      <stop offset="100%" stop-color="#F9D87C"/>
    </linearGradient>
    <linearGradient id="ap-gold-rim-weboracle-512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#FFE082" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9A5B00" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="ap-contact-weboracle-512" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#080312" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#080312" flood-opacity="0.22"/>
    </filter>
    <filter id="ap-bloom-weboracle-512" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="11" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="sq-weboracle-512" d="M 256,0 C 438,0 512,74 512,256 C 512,438 438,512 256,512 C 74,512 0,438 0,256 C 0,74 74,0 256,0 Z"/>
  
    <linearGradient id="wo6-bg-512" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0%" stop-color="#FCF9FF"/><stop offset="48%" stop-color="#EDE0FF"/><stop offset="100%" stop-color="#D3B8F8"/></linearGradient>
    <radialGradient id="wo6-aura-512" cx="50%" cy="14%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#8764B8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5C2E91" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wo6-wing-512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="58%" stop-color="#F3E5F5" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#D1C4E9" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="wo6-wing-rim-512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#EA80FC" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#80D8FF" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="wo6-dial-512" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#673AB7"/>
      <stop offset="50%" stop-color="#311B92"/>
      <stop offset="85%" stop-color="#140738"/>
      <stop offset="100%" stop-color="#3D5AFE"/>
    </radialGradient>
    <linearGradient id="wo6-iris-512" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A148C"/>
      <stop offset="40%" stop-color="#AA00FF"/>
      <stop offset="76%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#80D8FF"/>
    </linearGradient>
    <filter id="wo6-ambient-512" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1A0638" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1A0638" flood-opacity="0.18"/>
    </filter>
  </defs>

  
      <use href="#sq-weboracle-512" fill="url(#wo6-bg-512)"/>
      <use href="#sq-weboracle-512" fill="url(#wo6-aura-512)"/>
      
      <use href="#sq-weboracle-512" fill="none" stroke="#FFFFFF" stroke-width="5.5" opacity="0.9"/>
    

  
